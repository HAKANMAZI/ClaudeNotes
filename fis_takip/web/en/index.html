<h1>🧾 Fiş Takip</h1>
<div class="card">
<label class="btn" style="display:block;text-align:center"><input id="f" type="file" accept="image/*" multiple hidden>📷 Fiş fotoğrafı ekle</label>
<button class="g" id="mb" style="width:100%;margin-top:8px">✍️ Fişsiz harcama ekle (aidat, kira…)</button>
<div id="st" class="mu" style="margin-top:8px"></div>
<details style="margin-top:8px"><summary class="mu">Düğme açılmıyorsa buradan dene</summary><div class="mu" style="margin-top:6px">Galeriden:</div><input id="f2" type="file" accept="image/*" multiple><div class="mu" style="margin-top:6px">Kameradan:</div><input id="f3" type="file" accept="image/*" capture="environment"></details></div>
<div class="tabs"><button data-t="c" class="on">Takvim</button><button data-t="l" class="g">Fişler</button><button data-t="s" class="g">İstatistik</button><button data-t="f" class="g">Finans</button><button data-t="o" class="g">Öneriler</button></div>

</main>
<script>window.DEFAULT_LANG="en";</script>
<script>/* Streamlit / bağımsız sürüm köprüsü.
   claude.ai'deki window.claude yeteneklerini tarayıcıda taklit eder:
   - db: kayıtları tarayıcının IndexedDB'sinde tutar (cihaza özel)
   - sample: fiş okuma ve öneriler için kullanıcının kendi Anthropic API anahtarını kullanır
   - ⚙️ paneli: API anahtarı, yedek al / yedek yükle */
(function(){
var KK="ft_key",MODEL="claude-sonnet-5-5";
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
/* Tarayıcı içi veritabanı (IndexedDB) */
var idb=new Promise(function(ok,no){var q=indexedDB.open("fistakip",1);q.onupgradeneeded=function(){q.result.createObjectStore("d")};q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error)}});
function tx(m,f){return idb.then(function(d){return new Promise(function(ok,no){var t=d.transaction("d",m),r=f(t.objectStore("d"));t.oncomplete=function(){ok(r&&r.result)};t.onerror=function(){no(t.error)};t.onabort=function(){no(t.error||new Error("Kayıt başarısız"))}})})}
function all(){return tx("readonly",function(s){return s.getAll()})}
var db={collection:function(){return{
  get:function(){return all().then(function(a){return{docs:(a||[]).map(function(x){return{data:function(){return x}}})}})},
  doc:function(id){return{set:function(x){return tx("readwrite",function(s){return s.put(x,id)})},delete:function(){return tx("readwrite",function(s){return s.delete(id)})}}}}}};
/* Anahtar yoksa pencere açar; girilince işlem kaldığı yerden devam eder */
function askKey(){return new Promise(function(ok,no){var w=document.createElement("div");w.setAttribute("style","position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font:14px system-ui");
  w.innerHTML='<div style="background:#1c1c1e;color:#eee;border:1px solid #555;border-radius:12px;padding:16px;width:min(340px,calc(100vw - 32px))"><b>Claude için API anahtarı gir</b><div style="color:#aaa;font-size:13px;margin:6px 0 10px">Fiş okuma ve öneriler senin Anthropic API anahtarınla yapılır, ücreti senin hesabından düşer. Anahtar sadece bu tarayıcıda saklanır.</div><input id="akk" type="password" placeholder="sk-ant-..." autocomplete="off" style="width:100%;box-sizing:border-box;padding:8px;margin-bottom:10px"><div style="display:flex;gap:8px"><button id="akx" style="flex:1;padding:8px">İptal</button><button id="akok" style="flex:1;padding:8px">Kaydet ve devam et</button></div></div>';
  document.body.appendChild(w);var i=w.querySelector("#akk");i.focus();
  w.querySelector("#akx").onclick=function(){w.remove();no(new Error("API anahtarı girilmedi."))};
  w.querySelector("#akok").onclick=function(){var v=i.value.trim();if(!v){i.focus();return}localStorage.setItem(KK,v);w.remove();sync();ok(v)}})}
function b64(b){return new Promise(function(ok){var f=new FileReader();f.onload=function(){ok(String(f.result).split(",")[1])};f.readAsDataURL(b)})}
/* Claude çağrısı: fotoğraf + metin gönderir, ücret kullanıcının hesabından düşer */
async function sample(input,o){o=o||{};var key=localStorage.getItem(KK);
  if(!key)key=await askKey();
  var imgs=await Promise.all((o.images||[]).map(b64));
  var content=imgs.map(function(d){return{type:"image",source:{type:"base64",media_type:"image/jpeg",data:d}}});
  content.push({type:"text",text:typeof input==="string"?input:JSON.stringify(input)});
  var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:6000,messages:[{role:"user",content:content}]})});
  var j=await r.json().catch(function(){return{}});
  if(!r.ok){if(r.status===401){localStorage.removeItem(KK);sync();throw new Error("API anahtarı geçersiz. Tekrar denediğinde yeni anahtar sorulacak.")}if(r.status===429)throw new Error("rate limit: biraz sonra tekrar dene.");throw new Error((j.error&&j.error.message)||"API hatası ("+r.status+")")}
  return{text:j.content.filter(function(c){return c.type==="text"}).map(function(c){return c.text}).join(""),truncated:j.stop_reason==="max_tokens"}}
sample.json=async function(i,o){var t=(await sample(i,o)).text;return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))};
sample.limits=async function(){return{images:true}};
var M={db:db,user:{id:async function(){return"yerel"}},sample:sample};
window.claude={use:async function(n){return M[n]||null}};
function panel(open){var p=document.getElementById("ftp");if(!p)return;p.style.display=open?"block":(p.style.display==="block"?"none":"block");sync()}
function sync(){var s=document.getElementById("fts");if(!s)return;var k=localStorage.getItem(KK);all().then(function(a){s.textContent=(k?"Anahtar kayıtlı ✓":"Anahtar yok ✗")+" · "+(a||[]).length+" kayıt bu tarayıcıda"})}
/* Sağ alttaki ⚙️ düğmesi ve ayar paneli */
function build(){
  var b=document.createElement("button");b.textContent="⚙️";b.setAttribute("style","position:fixed;right:12px;bottom:12px;z-index:99999;width:44px;height:44px;border-radius:22px;border:1px solid #555;background:#222;color:#fff;font-size:20px");
  var p=document.createElement("div");p.id="ftp";p.setAttribute("style","display:none;position:fixed;right:12px;bottom:64px;z-index:99999;width:min(320px,calc(100vw - 24px));background:#1c1c1e;color:#eee;border:1px solid #555;border-radius:12px;padding:12px;font:14px system-ui");
  p.innerHTML='<b>Ayarlar</b><div id="fts" style="margin:6px 0;color:#aaa;font-size:13px"></div><label style="font-size:13px">Anthropic API anahtarı</label><input id="ftk" type="password" placeholder="sk-ant-..." autocomplete="off" style="width:100%;box-sizing:border-box;margin:4px 0 6px;padding:8px"><button id="ftsv" style="width:100%;padding:8px;margin-bottom:10px">Anahtarı kaydet</button><button id="ftex" style="width:100%;padding:8px;margin-bottom:6px">⬇️ Yedek al</button><button id="ftim" style="width:100%;padding:8px">⬆️ Yedek yükle</button><input id="ftf" type="file" accept=".json,application/json" style="display:none"><div style="margin-top:8px;color:#aaa;font-size:12px">Veriler ve anahtar sadece bu tarayıcıda durur. Telefon ve bilgisayar ayrıdır; taşımak için yedek al/yükle kullan.</div>';
  document.body.appendChild(b);document.body.appendChild(p);b.onclick=function(){panel()};
  document.getElementById("ftsv").onclick=function(){var v=document.getElementById("ftk").value.trim();if(v){localStorage.setItem(KK,v);document.getElementById("ftk").value=""}sync()};
  document.getElementById("ftex").onclick=function(){all().then(function(a){var u=URL.createObjectURL(new Blob([JSON.stringify({app:"fis-takip",docs:a||[]})],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="fis-takip-yedek-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(l);l.click();l.remove()})};
  document.getElementById("ftim").onclick=function(){document.getElementById("ftf").click()};
  document.getElementById("ftf").onchange=function(){var f=this.files[0];if(!f)return;f.text().then(function(t){var j=JSON.parse(t),a=Array.isArray(j)?j:(j.docs||[]);a=a.filter(function(x){return x&&x.id});return Promise.all(a.map(function(x){return tx("readwrite",function(s){return s.put(x,x.id)})})).then(function(){alert(a.length+" kayıt yüklendi.");location.reload()})}).catch(function(e){alert("Yedek okunamadı: "+e.message)})};
  sync()}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",build);else build();
})();
</script>
