<script>
/* ================================================================
   FİŞ TAKİP — kişisel bütçe uygulaması
   Bölümler: veri yükleme/kaydetme, fiş okuma (Claude), takvim,
   fişler ve arama, istatistik, finans, fişsiz harcama formu, öneriler.
   Veri: claude.ai veritabanı (db), yoksa tarayıcının localStorage'ı.
   ================================================================ */

const $=s=>document.querySelector(s);
/* HTML'e güvenli metin yazmak için kaçış. */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Sayıyı Türk lirası biçiminde gösterir (1.234,56 ₺). */
const TL=n=>(Number(n)||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺";
/* Uygulamanın durumu: R harcamalar, F gelir/yatırım/birikim, tab açık sekme. */
let R=[],F=[],AJ=[],tab="c",col=null,sample=null,qs="";
// Depolama: db varsa onu, yoksa localStorage
/* Açılış: Claude bağlantısını (db, user, sample) kurar, kayıtları yükler, ilk ekranı çizer. */
async function init(){
  try{const [db,u]=await Promise.race([Promise.all([claude.use("db"),claude.use("user")]),new Promise(r=>setTimeout(()=>r([null,null]),8000))]);
    if(db&&u){const id=await u.id();col=db.collection("data/users/"+id);
      const s=await col.get();R=s.docs.map(d=>typeof d.data==="function"?d.data():d.data);F=R.filter(x=>x.fin);AJ=R.filter(x=>x.ajd);R=R.filter(x=>!x.fin&&!x.ajd);}}catch(e){col=null}
  if(!col){try{R=JSON.parse(localStorage.getItem("fis")||"[]")}catch(e){R=[]}try{F=JSON.parse(localStorage.getItem("fis_fin")||"[]")}catch(e){F=[]}try{AJ=JSON.parse(localStorage.getItem("fis_ajd")||"[]")}catch(e){AJ=[]}}
  try{sample=await Promise.race([claude.use("sample"),new Promise(r=>setTimeout(()=>r(null),12000))])}catch(e){}
  let lim=null;if(sample){try{lim=await sample.limits()}catch(e){}}
  $("#st").textContent=!sample?"Claude bağlantısı yok (bu görünümde fotoğraf okunamaz).":lim&&lim.images?"":"Claude var ama fotoğraf gönderme kapalı.";
  render();
}
/* Yeni fişi kaydeder. Veritabanı fotoğrafı kabul etmezse fotoğrafsız tekrar dener. */
async function save(r){
  R.push(r);
  if(col){try{await col.doc(r.id).set(r)}catch(e){if(r.foto){r.foto="";try{await col.doc(r.id).set(r)}catch(x){}}}}
  else{try{localStorage.setItem("fis",JSON.stringify(R))}catch(e){}}
}
/* Kaydı listeden ve veritabanından siler. */
async function del(id){
  R=R.filter(r=>r.id!==id);
  if(col){try{await col.doc(id).delete()}catch(e){}}
  else{try{localStorage.setItem("fis",JSON.stringify(R))}catch(e){}}
  render();
}
/* Fiş fotoğrafını Claude'a göndermeden önce küçültüp sıkıştırır. */
function shrink(file){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1800/Math.max(im.width,im.height));
  const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>b?ok(b):no(new Error("görsel")),"image/jpeg",.85)};im.onerror=()=>no(new Error("görsel"));im.src=URL.createObjectURL(file)})}
/* Fiş fotoğrafını okuması için Claude'a gönderilen talimat (JSON çıktısı ister). */
const PROMPT=`Bu bir Türkiye fişi/faturası/slip fotoğrafı. Sadece JSON döndür, başka metin yok:
{"magaza":"","tarih":"YYYY-MM-DD","toplam":0,"tur":"market|yakit|diger","kalemler":[{"ad":"okunaklı ürün adı (marka + ürün + gramaj, aynı ürünü her fişte aynı yaz)","miktar":1,"birim":"adet|kg|lt","tutar":0,"kategori":"Gıda|Atıştırmalık|Kuru yemiş/meyve|İçecek|Temizlik|Ev eşyası|Yakıt|Diğer"}]}
Kısaltmaları açıkla (ör. "KA RULO BUYUK" -> "Kağıt rulo büyük"). Slip sadece tutar gösteriyorsa tek kalem yaz. Okuyamadığın alanı boş bırak, uydurma. Tutarlar sayı olsun.`;
$("#f").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";
  if(!files.length)return;
  $("#st").textContent="Fotoğraf alındı…";
  if(!sample){try{sample=await Promise.race([claude.use("sample"),new Promise(r=>setTimeout(()=>r(null),15000))])}catch(x){}}
  if(!sample){$("#st").textContent="Claude erişimi verilmedi veya kullanılamıyor. Sayfayı yenileyip izin ver.";return}
  for(const f of files){
    try{$("#st").textContent="Okunuyor: "+f.name+" …";
      $("#st").textContent="Fotoğraf küçültlüyor…";const b=await shrink(f);
      const th=await Promise.race([thumb(f),new Promise(r=>setTimeout(()=>r(""),8000))]);
      $("#st").textContent="Claude'a gönderildi, okunuyor… (ilk seferde izin penceresi çıkabilir, 10-40 sn sürebilir)";
      const j=await sample.json(PROMPT,{images:[b],modelTier:"default"});
      j.id="r"+Date.now()+Math.floor(Math.random()*1e3);j.foto=th;
      j.kalemler=Array.isArray(j.kalemler)?j.kalemler:[];
      if(!/^\d{4}-\d{2}-\d{2}$/.test(j.tarih||"")){j.tarih=ymd(new Date(f.lastModified||Date.now()));j.tahmin=true}
      const sum=j.kalemler.reduce((a,k)=>a+(+k.tutar||0),0);
      j.uyari=j.toplam&&sum&&Math.abs(sum-j.toplam)>0.5?"Kalem toplamı ("+TL(sum)+") fiş toplamıyla uyuşmuyor, kontrol et.":"";
      if(j.tahmin)j.uyari=(j.uyari?j.uyari+" ":"")+"Tarih okunamadı, fotoğraf tarihi kullanıldı. Aşağıdan değiştirebilirsin.";
      await save(j);$("#st").textContent="Eklendi ✓";setTimeout(()=>{if($("#st").textContent==="Eklendi ✓")$("#st").textContent=""},4000);if(j.tarih){cm=new Date(j.tarih+"T00:00:00");cm.setDate(1);sel=j.tarih}render();
    }catch(err){const c=err&&err.code,M={not_granted:"İzin verilmedi. Sayfayı yenile, izin penceresinde izin ver.",images_unavailable:"Bu görünümde fotoğraf gönderme kapalı. Sayfayı claude.ai üzerinden yeniden aç.",rate_limited:"Çok hızlı denendi, biraz bekle.",image_rejected:"Fotoğraf kabul edilmedi (tür veya boyut)."};$("#st").textContent="Okunamadı: "+(M[c]||(c?c+" — ":"")+(err&&err.message||"hata"))}
  }
  e.target.value="";
};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;
  document.querySelectorAll(".tabs button").forEach(x=>x.className=x===b?"on":"g");render()});
/* Kayıtları tarihe göre (yeniden eskiye) sıralar. */
const sorted=()=>[...R].sort((a,b)=>(b.tarih||"").localeCompare(a.tarih||""));
/* Seçili sekmeyi (Takvim, Fişler, İstatistik, Finans, Öneriler) yeniden çizer. */
function render(){alarmSync();const v=$("#v");
  if(tab==="c"){cal(v);return}
  if(tab==="a"){ajd(v);return}
  if(tab==="f"){fin(v);return}
  if(!R.length){v.innerHTML='<div class="card mu">Henüz fiş yok. Yukarıdan fotoğraf ekle.</div>';return}
  if(tab==="l"){v.innerHTML='<input id="q" type="search" placeholder="🔍 Ara: çöp poşeti, süt, Migros…" value="'+esc(qs)+'" oninput="qs=this.value;LQ()" style="width:100%;margin-bottom:8px"><div id="ql"></div>';LQ();return}
  if(tab==="s"){if(smode==="m")mstats(v);else{stats(v);v.innerHTML=(window._nn?"":stNav())+v.innerHTML}}
  if(tab==="o")advice(v);
}
/* Arama için metni sadeleştirir: küçük harf, Türkçe karakterler düz harfe. */
const sn=s=>String(s||"").toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9 ]/g," ").replace(/ +/g," ").trim();
/* Fişler sekmesindeki tek bir kayıt kartı (Sil, Düzenle, Fişi gör). */
const fcard=r=>`<details class="card"><summary><div class="row"><b>${esc(r.magaza||"Fiş")}</b><span class="tot gd">${TL(r.toplam)}</span></div><div class="mu">${esc(r.tarih||"tarih yok")} · ${r.kalemler.length} kalem</div></summary>
   ${r.uyari?`<div class="wa">${esc(r.uyari)}</div>`:""}
   ${r.kalemler.map(k=>`<div class="it"><span>${esc(k.ad)} <span class="mu">${k.acik?esc(k.acik)+" · ":""}${esc(k.kategori||"")}${k.miktar&&k.miktar!=1?" · "+esc(k.miktar)+" "+esc(k.birim||""):""}</span></span><span>${TL(k.tutar)}</span></div>`).join("")}

/* Fişler sekmesindeki hızlı arama: ürün, açıklama, kategori, mağaza ve tarihte arar. */
function LQ(){const box=$("#ql");if(!box)return;const q=qs.trim();
  if(!q){box.innerHTML=sorted().map(fcard).join("");return}
  const T=sn(q).split(" ").filter(Boolean),ok=h=>T.every(t=>h.includes(t)||(t.length>=5&&h.includes(t.slice(0,-1)))),H=[];
  R.forEach(r=>(r.kalemler||[]).forEach(k=>{if(ok(sn([k.ad,k.acik,k.kategori,r.magaza,r.tarih].join(" "))))H.push({r,k})}));
  if(!H.length){box.innerHTML='<div class="card mu">"'+esc(q)+'" için kayıt bulunamadı. Farklı bir kelime dene (ör. torba, poşet).</div>';return}
  H.sort((a,b)=>(b.r.tarih||"").localeCompare(a.r.tarih||""));

      (ay.length?ay.map(x=>row(esc(x.tarih)+" · "+esc(x.ad)+` <span class="mu">${FT[x.t]}</span>`,TL(x.tutar))).join(""):'<div class="mu">Bu ay yok.</div>')+row("<b>Toplam ayrılan</b>","<b>"+TL(Y+B+HY)+"</b>")+`</div>`+

/* İstatistik görünüm modu (aylık/tümü). */
let smode="m";
/* İstatistikte Aylık / Tümü geçişi. */
function setSm(m){smode=m;render()}
/* İstatistikte ay değiştirir. */
function stNav(){return `<div class="card"><div class="row" style="align-items:center"><span><button class="${smode==="a"?"on":"g"}" onclick="setSm('a')">Tümü</button> <button class="${smode==="m"?"on":"g"}" onclick="setSm('m')">Aylık</button></span>${smode==="m"?`<span><button class="g" onclick="mv(-1)">‹</button> <b>${MN[cm.getMonth()]} ${cm.getFullYear()}</b> <button class="g" onclick="mv(1)">›</button></span>`:""}</div></div>`}
/* İstatistik sekmesinin "Aylık" görünümü. */
function mstats(v){
  const y=cm.getFullYear(),m=cm.getMonth(),key=y+"-"+String(m+1).padStart(2,"0"),pk=ymd(new Date(y,m-1,1)).slice(0,7),inK=k=>x=>(x.tarih||"").slice(0,7)===k,
    S=R.filter(inK(key)),P=R.filter(inK(pk)),sm=a=>a.reduce((s,x)=>s+(+x.toplam||0),0),tot=sm(S),ptot=sm(P),
    gel=F.filter(x=>x.t==="gelir"&&inK(key)(x)).reduce((s,x)=>s+(+x.tutar||0),0),dim=new Date(y,m+1,0).getDate(),now=new Date(),dn=(now.getFullYear()===y&&now.getMonth()===m)?now.getDate():dim;
  if(!S.length){v.innerHTML=(window._nn?"":stNav())+`<div class="card mu">${MN[m]} ${y} için harcama kaydı yok.</div>`;return}
  const cat={},it={},wd=Array(7).fill(0),dy=Array(dim).fill(0),ty={};
  S.forEach(r=>{const t=+r.toplam||0,tp=r.tur==="yakit"?"Yakıt":"Diğer harcamalar";ty[tp]=(ty[tp]||0)+t;
    if(r.tarih){wd[(new Date(r.tarih+"T00:00:00").getDay()+6)%7]+=t;dy[+r.tarih.slice(8,10)-1]+=t}
    r.kalemler.forEach(k=>{const c=k.kategori||"Diğer",x=+k.tutar||0;cat[c]=(cat[c]||0)+x;const n=(k.ad||"").trim();if(n)it[n]=(it[n]||0)+x})});
  const t6=Object.entries(cat).sort((a,b)=>b[1]-a[1]),rest=t6.slice(6).reduce((a,e)=>a+e[1],0),c6=t6.slice(0,6);if(rest)c6.push(["Diğer (kalan)",rest]);
  const ct=c6.reduce((a,e)=>a+e[1],0)||1;let acc=0;const grad=c6.map((e,i)=>{const s=acc/ct*100;acc+=e[1];return COL[i]+" "+s+"% "+acc/ct*100+"%"}).join(",");
  const wm=Math.max(...wd,1),dm=Math.max(...dy,1),DN=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"],top=Object.entries(it).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const diff=ptot?`<b class="${tot>ptot?"up":"dw"}">${tot>ptot?"▲":"▼"} %${Math.abs((tot/ptot-1)*100).toFixed(0)}</b><span class="mu">${MN[(m+11)%12]} (${TL(ptot)}) göre</span>`:`<b>–</b><span class="mu">önceki ay verisi yok</span>`;
  v.innerHTML=(window._nn?"":stNav())+`<div class="kp"><div class="card" style="grid-column:1/-1"><span class="mu">${MN[m]} ${y} toplam harcama</span><b class="gd" style="font-size:24px">${TL(tot)}</b><span class="mu">${S.length} kayıt · günlük ort. ${TL(tot/dn)}</span></div>
  <div class="card"><span class="mu">Önceki aya göre</span>${diff}</div>
  <div class="card"><span class="mu">Dağılım</span>${Object.entries(ty).map(([k,x])=>`<div class="row"><span>${k}</span><b style="font-size:14px">%${(x/(tot||1)*100).toFixed(0)}</b></div>`).join("")}</div>
  ${gel?`<div class="card"><span class="mu">Gelir</span><b class="dw">${TL(gel)}</b></div><div class="card"><span class="mu">Gelir − harcama</span><b class="${gel>=tot?"dw":"up"}">${gel<tot?"−":""}${TL(Math.abs(gel-tot))}</b></div>`:""}</div>
  <div class="card"><b>Günlük harcama</b><div class="cols" style="height:110px;gap:2px">${dy.map(x=>`<div><i style="height:${x?Math.max(4,x/dm*100):0}%;background:#c8504a;margin:0"></i></div>`).join("")}</div><div class="row mu"><span>1</span><span>${Math.ceil(dim/2)}</span><span>${dim}</span></div></div>
  <div class="card"><b>Kategoriler</b><div class="row" style="align-items:center;margin-top:10px"><div class="dn2" style="background:conic-gradient(${grad})"></div><div class="lg">${c6.map((e,i)=>`<div data-kat="${esc(e[0])}" style="cursor:pointer"><span><s style="background:${COL[i]}"></s>${esc(e[0])} ›</span><span>%${(e[1]/ct*100).toFixed(0)}</span></div>`).join("")}</div></div><div class="mu" style="margin-top:8px">En yüksek: ${esc(c6[0][0])} · ${TL(c6[0][1])}</div></div>
  <div class="card"><b>Haftanın günleri</b><div style="margin-top:8px">${wd.map((x,i)=>`<div class="row"><span>${DN[i]}</span><span>${TL(x)}</span></div><div class="bar"><i style="width:${Math.max(1,x/wm*100)}%;background:#c8504a"></i></div>`).join("")}</div></div>
  <div class="card"><b>En pahalı kalemler</b>${top.map(([k,x])=>`<div class="it"><span>${esc(k)}</span><span>${TL(x)}</span></div>`).join("")}</div>
  ${bsl(S)}
  ${allk(S)}
  ${infl([pk,key])}`;
}
