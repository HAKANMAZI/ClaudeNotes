  Bu dosya tek başına çalışan bir web uygulamasıdır.
  Tarayıcıda açmanız yeterli; kurulum gerekmez.

  Nasıl çalışır?
  1) İstasyon listesini "Radio Browser" adlı ücretsiz ve açık

  2) Listede her radyonun canlı yayın adresi (stream linki) vardır.

     (<audio>) bu adres verilir, yayın doğrudan radyonun
     kendi sunucusundan çalınır.

<style>
  /* ---------- RENKLER ----------
     Tüm renkler burada tanımlı. Rengi değiştirmek için
     sadece bu satırı düzenlemek yeterli.
     --bg: arka plan, --card: kutular, --line: çizgiler,
     --txt: yazı, --dim: soluk yazı, --acc: vurgu (turuncu) */
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--txt:#e9ebf0;--dim:#8b91a0;--acc:#ff5a36}
  *{box-sizing:border-box}

  /* Sayfanın genel görünümü. Alttaki boşluk, sabit çalar çubuğu
     listenin üstünü kapatmasın diye. */
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:150px}

  /* Üst bölüm: kaydırınca da yukarıda sabit kalır */
  header{position:sticky;top:0;background:var(--bg);padding:14px 14px 8px;z-index:5;border-bottom:1px solid var(--line)}
  h1{margin:0 0 10px;font-size:22px}
  h1 span{color:var(--acc)}
  /* Amblem (başlıktaki yuvarlak logo) */
  h1 .amblem{width:40px;height:40px;vertical-align:middle;border-radius:50%}

  /* Arama kutusu, ülke seçimi ve düğmeler yan yana dizilir */
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,select,button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  input{flex:1;min-width:140px}
  button{cursor:pointer}
  /* Seçili sekme turuncu görünür */
  button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .tabs{margin-top:8px}

  /* ---------- İSTASYON LİSTESİ ---------- */
  #list{padding:10px 14px;display:grid;gap:8px}
  /* Her bir radyo satırı */
  .st{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
  /* Şu an çalan radyonun çerçevesi turuncu olur */
  .st.playing{border-color:var(--acc)}
  /* Radyo logosu (logo yoksa baş harfi gösterilir) */
  .logo{width:48px;height:48px;border-radius:8px;background:#262a33;flex:none;object-fit:cover;display:grid;place-items:center;font-weight:700;color:var(--dim)}
  .info{flex:1;min-width:0}
  /* Uzun isimler "…" ile kısaltılır */
  .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Favori yıldızı: boşsa gri, doluysa sarı */
  .fav{background:none;border:none;font-size:22px;padding:4px 6px;color:var(--dim)}
  .fav.yes{color:#ffc83d}
  /* Elle radyo ekleme formu */
  .addform{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
  .addform b{font-size:15px}
  .addform small{color:var(--dim);line-height:1.4}
  .addform button{background:var(--acc);border-color:var(--acc);color:#fff}
  /* "Yükleniyor…", "Sonuç yok" gibi mesajlar */
  .msg{color:var(--dim);text-align:center;padding:30px}

  /* ---------- ALTTAKİ ÇALAR ÇUBUĞU ---------- */
  #player{position:fixed;left:0;right:0;bottom:0;background:#14171d;border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:12px}
  /* Yuvarlak çal/durdur düğmesi */
  #pp{width:52px;height:52px;border-radius:50%;background:var(--acc);border:none;color:#fff;font-size:22px;flex:none}
  #now{flex:1;min-width:0}
  /* Ses ayarı çubuğu */
  #vol{width:90px}

  /* ---------- v2: RADYO / PODCAST GEÇİŞİ ---------- */
  .mode{margin-bottom:10px}
  .mode button{flex:1;font-weight:600}
  [hidden]{display:none!important}
  /* Podcast kategori düğmeleri */
  .ptabs{margin-top:8px}
  .ptabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  /* Bölüm listesi üst kısmı (geri düğmesi + podcast adı) */
  .podhead{display:flex;align-items:center;gap:10px;padding:4px 0 6px}
  .podhead img{width:64px;height:64px;border-radius:10px}
  .podhead .name{white-space:normal}
  /* Bölümün ne kadarının dinlendiğini gösteren ince çubuk */
  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc)}
  .dl{color:var(--dim);text-decoration:none;font-size:20px;padding:4px 6px}
  /* Sarma çubuğu (sadece podcastte görünür) */
  #player{flex-wrap:wrap}
  #seek{width:100%;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  #seek input{flex:1;padding:0}
  #seek button{padding:6px 8px;font-size:12px}

  /* ---------- v3: KÖŞE YAZILARI ---------- */
  .ctabs{margin-top:8px}
  .ctabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .col .info{display:grid;gap:3px}
  .col .who{font-size:13px;color:var(--acc);font-weight:600}
  .col .name{white-space:normal}
  /* Özet en fazla iki satır görünür */
  .col .ex{font-size:13px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* Uyarı şeridi: yedek kaynak kullanılınca görünür */
  #notice{margin:10px 14px 0;padding:8px 12px;border-radius:10px;background:#3a2a10;color:#ffd58a;font-size:13px}

  /* ---------- KAPANMA ZAMANLAYICISI ---------- */
  #sleepBtn{padding:8px 10px;white-space:nowrap}
  #sleepBtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
  /* Süre seçme paneli: çalar çubuğunun hemen üstünde açılır */
  #sleepPanel{position:fixed;right:14px;bottom:130px;z-index:10;background:#14171d;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;width:260px;box-shadow:0 8px 30px #0008}
  #sleepPanel b{font-size:14px}
  #sleepPanel .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #sleepPanel input{min-width:0}
  /* Yayın akışı (radyonun web sitesi) bağlantısı */
  #web{color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-decoration:none;font-size:13px;white-space:nowrap}

  /* ============ MOBİL UYUM ============
     Telefonda: sayfa yana taşmaz, sekmeler tek satırda yana kayar,
     çalar çubuğu sadeleşir (ses telefonun tuşlarıyla ayarlanır). */
  /* "clip": yana taşmayı keser ama üst bölümün sabit kalmasını bozmaz ("hidden" bozuyordu) */
  html,body{overflow-x:clip}
  header{position:sticky;top:0;z-index:5}
  #list{grid-template-columns:minmax(0,1fr)}   /* Uzun isimler satırı taşırmasın */
  .st{min-width:0}
  h1{display:flex;align-items:center;gap:10px;font-size:21px}
  h1 .amblem{width:46px;height:46px;flex:none;border-radius:50%;box-shadow:0 0 0 2px #ffffff22}
  h1 .ad{display:grid;line-height:1.15;color:var(--acc);min-width:0}
  h1 .ad span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  h1 .ad small{font-size:11px;color:var(--dim);font-weight:500}
  @media (max-width:640px){
    header{padding:10px 10px 6px}
    .tabs,.ptabs,.ctabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}

<!-- Tarayıcının kendi ses çaları. Ekranda görünmez;
     radyonun yayın adresini bu çalar çalar. -->
<audio id="audio" preload="none"></audio>
<!-- HLS (.m3u8) yayınları için yardımcı kütüphane -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

<script>
/* ============================================================
   1) AYARLAR VE DEĞİŞKENLER
   ============================================================ */

// Radio Browser veritabanının sunucuları.
// Biri çalışmazsa sıradaki denenir (yedekli çalışma).
const API = ["https://de1.api.radio-browser.info","https://nl1.api.radio-browser.info","https://at1.api.radio-browser.info",
             "https://de2.api.radio-browser.info","https://fi1.api.radio-browser.info"];

// Kısayol: $("#q") yazınca sayfadaki id="q" öğesini bulur.
const $ = s => document.querySelector(s);

// Ses çaları
const audio = $("#audio");

let stations = [];   // Son aramada gelen radyolar
let current = null;  // Şu an çalan radyo
let tag = "";        // Seçili tür ("" = tümü)
let showFav = false; // Favoriler sekmesi açık mı?
let showMine = false;// "Benim radyolarım" sekmesi açık mı?

/* ============================================================
   2) TARAYICIYA KAYIT (favoriler ve ses seviyesi)
   ------------------------------------------------------------
   localStorage: tarayıcının küçük bir hafızası. Sayfayı kapatıp
   açınca favoriler kaybolmaz. Sadece bu tarayıcıda saklanır.
   ============================================================ */
const store = {
  // Kayıtlı değeri oku; yoksa varsayılanı (d) döndür
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  // Değeri kaydet
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

// Açılışta favorileri ve son ses seviyesini geri yükle
// Veritabanında olmayan, uygulamaya hazır eklenen radyolar.
// Yeni radyo eklemek için bir satır kopyalayıp ad ve adresi değiştirin.
const EXTRA = [
  { stationuuid:"ek-radyo-belgesel", name:"Radyo Belgesel",
    url_resolved:"https://yayin2.canliyayin.org:9996/stream",
    homepage:"https://www.canliyayin.org/radyo/radyo-belgesel",
    country:"Türkiye", countrycode:"TR", tags:"documentary,belgesel,talk", bitrate:48 }
];

let favs = store.get("radyo_favs", []);
let mine = store.get("radyo_mine", []); // Elle eklenen radyolar
$("#vol").value = store.get("radyo_vol", 0.8);
audio.volume = $("#vol").value;

/* ============================================================
   3) VERİTABANINA SORU SORMA
   ------------------------------------------------------------
   Sunuculara sırayla istek atar. İlk cevap veren sunucunun
   sonucunu döndürür. Hiçbiri cevap vermezse hata verir.
   ============================================================ */
async function api(path){
  for (const host of API){
    try{
      const r = await fetch(host + path);
      if (r.ok) return await r.json(); // Cevap geldi → listeyi döndür
    }catch(e){ /* Bu sunucu çalışmadı, sıradakine geç */ }
  }
  throw new Error("Sunucuya ulaşılamadı");
}

/* ============================================================
   4) RADYOLARI ARAMA VE LİSTELEME
   ============================================================ */
let reqNo = 0; // Her aramaya sıra numarası; eski aramanın geç gelen sonucu yenisini ezmesin

async function load(){
  const my = ++reqNo;
  if (window.katNotTemizle) katNotTemizle();
  showFav = false; showMine = false;
  $("#list").innerHTML = '<div class="msg">Yükleniyor…</div>';

  // Arama ayarları:
  // limit=80        → en fazla seksen radyo getir
  // order=clickcount→ en çok dinlenene göre sırala
  // reverse=true    → çoktan aza
  // hidebroken=true → bozuk (çalışmayan) radyoları gizle
  const p = new URLSearchParams({limit:80, order:"clickcount", reverse:"true", hidebroken:"true"});

  const c = $("#country").value;   // Seçili ülke kodu
  const q = $("#q").value.trim();  // Arama kutusundaki yazı

  if (q){
    // İsimle aranıyorsa tür filtresi kaldırılır: tüm radyolarda aranır.
    // (Örnek: "kafa" yazınca Pop sekmesi seçili olsa bile bulunur.)
    tag = "";
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
    $("#all").classList.add("on");
    p.set("name", q);
  }
  if (c) p.set("countrycode", c); // Ülke filtresi
  if (tag) p.set("tag", tag);
  // Şehir ve dil filtreleri (katalog bölümü ekler)
  if ($("#city") && $("#city").value) p.set("state", $("#city").value);
  if ($("#lang") && $("#lang").value) p.set("language", $("#lang").value);     // Tür filtresi

  try{
    stations = await api("/json/stations/search?" + p);
    if (my !== reqNo || mode !== "radio") return; // Bu arada yeni arama başladıysa veya podcaste geçildiyse sonucu at
    // Seçili ülkede bulunamazsa ülke filtresini kaldırıp tüm dünyada ara
    if (!stations.length && q && c){
      p.delete("countrycode");
      stations = await api("/json/stations/search?" + p);
      if (my !== reqNo) return;
    }
    // Hazır eklenen radyolar (EXTRA): ülke, tür ve aramaya uyuyorsa listenin başına eklenir
    const extra = EXTRA.filter(s =>
      (!c || s.countrycode === c || q) &&
      (!tag || s.tags.includes(tag)) &&
      (!q || s.name.toLocaleLowerCase("tr").includes(q.toLocaleLowerCase("tr"))));
    stations = extra.concat(stations);
    // Elle eklenen radyolar da aramada çıksın: adı aranan yazıyı içerenler listenin başına eklenir
    if (q){
      const k = q.toLocaleLowerCase("tr");
      const own = mine.filter(s=>s.name.toLocaleLowerCase("tr").includes(k));
      stations = own.concat(stations);
    }
    // Diğer kaynakları ekle, tekrarları ayıkla
    if (window.katalogRadyo){ stations = await katalogRadyo(stations, q); if (my !== reqNo) return; }
    render(stations);
    cachePut("cache_radio", p.toString(), stations.filter(s=>!s.custom).slice(0,80)); // Son listeyi sakla
    notice("");
  }
  catch(e){
    if (my !== reqNo) return;
    // YEDEK 1: Bu aramanın daha önce kaydedilmiş sonucu
    let backup = cacheGet("cache_radio", p.toString());
    let why = "Radyo listesi sunucusuna ulaşılamadı. Son kaydedilen liste gösteriliyor.";
    // YEDEK 2: Uygulamanın içindeki hazır Türk radyoları listesi
    if (!backup){
      const k = norm(q);
      backup = EXTRA.concat(BACKUP_STATIONS).filter(s =>
        (!k || norm(s.name).includes(k)) && (!tag || (s.tags||"").includes(tag)));
      why = "Radyo listesi sunucusuna ulaşılamadı. Uygulamanın içindeki yedek radyo listesi gösteriliyor.";
    }
    stations = backup;
    render(stations);
    notice("⚠️ " + why + " Radyolar yine kendi yayınlarından çalar.");
  }
}

}

/* ============================================================
   5) RADYO ÇALMA
   ------------------------------------------------------------
   Radyonun canlı yayın adresi (url_resolved) ses çalara verilir.
   Ses, Radio Browser'dan değil, doğrudan radyonun kendi
   yayın sunucusundan gelir.
   ============================================================ */
let playNo = 0;   // Her çalma isteğine sıra no; eski istek yenisini bozmasın
let hls = null;   // HLS (.m3u8) oynatıcısı, varsa

// Yayın listesi (.m3u / .pls) ise içindeki gerçek yayın adresini bulur
async function resolveUrl(u){
  if (/\.(m3u|pls)(\?|$)/i.test(u)){
    try{
      const t = await (await fetch(u)).text();
      const line = t.split(/\r?\n/).map(x=>x.trim())
        .find(x=>/^https?:\/\//i.test(x) || /^File\d*=https?:\/\//i.test(x));
      if (line) return line.replace(/^File\d*=/i, "");
    }catch(e){ /* listeye ulaşılamadı; adresin kendisi denenir */ }
  }
  return u;
}

// Bir adresi çalmayı dener. 15 saniye içinde başlamazsa "başarısız" döner.
function tryPlay(u){
  return new Promise(res=>{
    const done = ok=>{
      clearTimeout(t);
      audio.removeEventListener("playing", onP);
      audio.removeEventListener("error", onE);
      res(ok);
    };
    const onP = ()=>done(true);
    const onE = ()=>done(false);
    const t = setTimeout(()=>done(false), 15000);
    audio.addEventListener("playing", onP);
    audio.addEventListener("error", onE);

    if (hls){ hls.destroy(); hls = null; }
    if (/\.m3u8(\?|$)/i.test(u) && window.Hls && Hls.isSupported()){
      // HLS yayını (ör. Kral FM): telefonun kendi oynatıcısı her cihazda çalmıyor,
      // bu yüzden önce hls.js kullanılır. Android uygulamasında istekler
      // uygulamanın kendi aracısından geçer (tarayıcı engeline takılmaz).
      hls = new Hls({ xhrSetup: (xhr, url)=>{
        if (location.host === "appassets.androidplatform.net" && /^https?:/i.test(url)) xhr.open("GET", "/proxy?u=" + encodeURIComponent(url), true);
      }});
      let yerli = false;
      hls.on(Hls.Events.ERROR, (e, d)=>{
        if (!d.fatal) return;
        // hls.js başaramazsa cihazın kendi oynatıcısı bir kez denenir
        if (!yerli && audio.canPlayType("application/vnd.apple.mpegurl")){
          yerli = true; hls.destroy(); hls = null;
          audio.src = u; audio.load(); audio.play().catch(()=>{});
        } else onE();
      });
      hls.loadSource(u);
      hls.attachMedia(audio);
    } else {
      audio.src = u;
      audio.load();
    }
    audio.play().catch(()=>{}); // Hata olursa "error" olayı zaten yakalanır
  });
}

async function play(s){
  current = s;
  const my = ++playNo;
  $("#seek").hidden = true;      // Canlı radyoda sarma olmaz
  audio.onloadedmetadata = null; // Podcastin "kaldığın yer" ayarı radyoya karışmasın
  audio.playbackRate = 1;        // Radyo her zaman normal hızda
  $("#now .name").textContent = s.name.trim();
  $("#status").textContent = "Bağlanıyor…";

  // Radyonun web sitesi kayıtlıysa "Yayın akışı" düğmesini göster
  const w = $("#web");
  if (s.homepage){ w.href = s.homepage; w.style.display = ""; } else { w.style.display = "none"; }
  render(window._shown); // Çalan radyoyu turuncu çerçeveyle işaretlemek için

  // Önce Radio Browser'ın çözdüğü adres, olmazsa özgün adres denenir
  const adaylar = [...new Set([s.url_resolved, s.url].filter(Boolean))];
  for (const aday of adaylar){
    const u = await resolveUrl(aday);
    if (my !== playNo) return; // Bu arada başka radyo/bölüm seçildi
    if (await tryPlay(u)){
      // Veritabanına "bu radyo dinlendi" bilgisi (popülerlik için)
      if (!s.custom && !/^(ek|ti|sc)-/.test(String(s.stationuuid||""))) fetch(API[0] + "/json/url/" + s.stationuuid).catch(()=>{});
      return;
    }
  }
  if (my !== playNo) return;
  $("#pp").textContent = "▶";
  $("#status").textContent = "Bu istasyon şu an çalınamıyor. Başka bir radyo deneyin.";
}

/* ============================================================
   8) v2: PODCAST BÖLÜMÜ
   ------------------------------------------------------------
   Podcast nereden geliyor?
   Apple'ın herkese açık ve ücretsiz podcast arşivi (iTunes
   Search API). Anahtar veya üyelik gerekmez. Ses dosyası
   podcastin kendi sunucusundan çalınır.
   - Arama:   itunes.apple.com/search?media=podcast&term=…
   - Bölümler: itunes.apple.com/lookup?id=…&entity=podcastEpisode
   ============================================================ */
const IT = "https://itunes.apple.com";
let mode = "radio";                        // "radio" veya "pod"
let subs = store.get("pod_subs", []);      // Abone olunan podcastler
let prog = store.get("pod_prog", {});      // Kaldığın yer: bölüm kimliği → {t: saniye, d: süre, ...}
let podReq = 0;                            // Eski aramanın sonucu yenisini ezmesin
let podTerm = "__all__";                   // Son aranan kelime ("__all__" = Tümü)

// "Tümü" sekmesi için birlikte aranan kelimeler. Eklemek/çıkarmak serbest.
const ALL_TERMS = ["podcast","türkçe podcast","sohbet","belgesel","tarih","bilim","haber","ekonomi","spor","hikaye"];
let podsShown = [], epsShown = [], curPod = null;

/* ---------- ENGELLEME LİSTESİ ----------
   Podcastin adında, yapımcısında veya bölüm başlığında bu
   kelimelerden biri geçerse o içerik hiç gösterilmez.
   Liste ekranda görünmez; sadece buradan değiştirilir. */
const DEFAULT_BLOCK = ["fethullah gülen", "fetullah gülen", "f. gülen", "herkul", "hocaefendi", "hoca efendi", "gulen podcast", "gulen arabic", "gülen sesli kitap", "فتح الله كولن"];
const blocked = DEFAULT_BLOCK;

// Karşılaştırma için yazıyı sadeleştirir: küçük harf, Türkçe harfler → düz (ü→u, ş→s …)
function norm(s){
  return String(s||"").toLocaleLowerCase("tr")
    .replace(/ı/g,"i").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
// Bu podcast/bölüm engelli mi?
function isBlocked(x){
  const text = norm([x.collectionName, x.artistName, x.trackName, x.collectionCensoredName].join(" "));
  return blocked.some(w => w.trim() && text.includes(norm(w)));
}

// Apple arşivine istek at.
// Önce normal yolla (fetch) dener. Dosya bilgisayardan açıldığında
// (file://) tarayıcı bazı istekleri engelliyor; o zaman yedek yöntem
// olan JSONP kullanılır: cevap bir <script> etiketiyle alınır,
// bu yöntem her ortamda çalışır.
async function itunes(path){
  try{
    const r = await fetch(IT + path);
    if (r.ok) return await r.json();
  }catch(e){ /* Engellendi, yedek yönteme geç */ }
  return jsonp(IT + path);
}

let jsonpNo = 0;
function jsonp(url){
  return new Promise((ok, fail)=>{
    const name = "itunesCb" + (++jsonpNo);
    const s = document.createElement("script");
    const done = ()=>{ delete window[name]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(()=>{ done(); fail(new Error("Podcast sunucusuna ulaşılamadı")); }, 15000);
    window[name] = data=>{ done(); ok(data); };
    s.onerror = ()=>{ done(); fail(new Error("Podcast sunucusuna ulaşılamadı")); };
    s.src = url + "&callback=" + name;
    document.head.appendChild(s);
  });
}

// Saniyeyi "1:05:30" veya "5:30" biçimine çevirir
function fmt(sec){
  sec = Math.max(0, Math.floor(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0");
}
// Tarihi "14 Kasım 2026" biçiminde yazar
function trDate(d){ return new Date(d).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}); }

// Süreyi "1 sa 5 dk" biçiminde yazar (listelerde)
function fmtLong(sec){
  const h = Math.floor(sec/3600), m = Math.round(sec%3600/60);
  return (h ? h+" sa " : "") + m + " dk";
}

// --- Podcast arama ---
async function podSearch(term){
  const my = ++podReq;
  podTerm = term;
  $("#list").innerHTML = '<div class="msg">Yükleniyor…</div>';
  try{
    let results;
    if (term === "__all__"){
      // Tümü: kelimeleri aynı anda ara, sonuçları birleştir, aynı podcasti bir kez al
      const all = await Promise.allSettled(ALL_TERMS.map(t =>
        itunes("/search?media=podcast&country=TR&limit=100&term=" + encodeURIComponent(t))));
      const seen = new Set();
      results = [];
      all.forEach(x => x.status === "fulfilled" && x.value.results.forEach(p => {
        if (!seen.has(p.collectionId)){ seen.add(p.collectionId); results.push(p); }
      }));
      if (!results.length) throw new Error("Podcast sunucusuna ulaşılamadı");
    } else {
      const j = await itunes("/search?media=podcast&country=TR&limit=100&term=" + encodeURIComponent(term));
      results = j.results;
    }
    if (my !== podReq || mode !== "pod") return;
    renderPods(results, "Sonuç bulunamadı.");
    cachePut("cache_pods", term, results.slice(0,150).map(slimPod)); // Son sonucu sakla
    notice("");
  }catch(e){
    if (my !== podReq || mode !== "pod") return;
    // YEDEK 1: Apple'a ulaşılamazsa ikinci ücretsiz podcast arşivi (fyyd.de)
    try{
      const results = await fyydSearch(term === "__all__" ? "türkçe" : term);
      if (my !== podReq || mode !== "pod") return;
      if (results.length){
        renderPods(results, "Sonuç bulunamadı.");
        notice("⚠️ Apple podcast arşivine ulaşılamadı. Yedek podcast arşivi (fyyd) kullanılıyor.");
        return;
      }
    }catch(_){}
    // YEDEK 2: Daha önce kaydedilen sonuç
    const cached = cacheGet("cache_pods", term);
    if (cached){
      renderPods(cached, "Sonuç bulunamadı.");
      notice("⚠️ Podcast arşivlerine ulaşılamadı. Son kaydedilen liste gösteriliyor.");
    } else {
      $("#list").innerHTML = '<div class="msg">'+e.message+'. Aboneliklerim ve Devam et bölümleri yine çalışır.</div>';
    }
  }
}

// Podcast bilgisini saklamak için küçültür (sadece gerekli alanlar)
function slimPod(p){
  return {collectionId:p.collectionId, collectionName:p.collectionName, artistName:p.artistName,
    artworkUrl100:p.artworkUrl100, primaryGenreName:p.primaryGenreName, releaseDate:p.releaseDate,
    trackCount:p.trackCount, fyydId:p.fyydId};
}
// Bölüm bilgisini saklamak için küçültür
function slimEp(e){
  return {trackId:e.trackId, trackName:e.trackName, collectionName:e.collectionName, episodeUrl:e.episodeUrl,
    releaseDate:e.releaseDate, trackTimeMillis:e.trackTimeMillis, artworkUrl160:e.artworkUrl160};
}

// --- Podcast listesini çiz (kapak, ad, yapımcı, tür, abone yıldızı) ---
function renderPods(arr, emptyText){
  // Güncel tarihten geriye: en yeni bölümü yayınlanan podcast en üstte
  arr = arr.filter(p => !isBlocked(p)); // Engellenenleri çıkar
  arr = arr.slice().sort((a,b) => (a._rank!=null && b._rank!=null) ? a._rank-b._rank  // Popüler listede sıra korunur
    : (b.releaseDate||"").localeCompare(a.releaseDate||""));
  podsShown = arr; curPod = null;
  if (!arr.length){ $("#list").innerHTML = '<div class="msg">'+emptyText+'</div>'; return; }
  $("#list").innerHTML = arr.map((p,i)=>{
    const isSub = subs.some(s=>s.collectionId===p.collectionId);
    return `<div class="st" data-p="${i}">
      <img class="logo" loading="lazy" src="${esc(p.artworkUrl100||"")}" onerror="this.style.visibility='hidden'">
      <div class="info"><div class="name">${esc(p.collectionName)}</div>
      <div class="meta">${esc([p.releaseDate ? "Son bölüm: " + trDate(p.releaseDate) : "", p.artistName, p.primaryGenreName, p.trackCount ? p.trackCount+" bölüm" : ""].filter(Boolean).join(" · "))}</div></div>
      <button class="fav ${isSub?'yes':''}" data-ps="${i}" title="Abone ol">${isSub?'★':'☆'}</button>
    </div>`;
  }).join("");
}

// --- Bir podcastin bölümlerini aç ---
async function openPod(p){
  const my = ++podReq;
  curPod = p;
  $("#list").innerHTML = '<div class="msg">Bölümler yükleniyor…</div>';
  const sortNew = arr => arr.filter(r=>r.episodeUrl && !isBlocked(r))
    .sort((a,b) => (b.releaseDate||"").localeCompare(a.releaseDate||"")); // En yeni bölüm üstte
  const key = String(p.collectionId);
  try{
    let eps;
    if (p.fyydId) eps = await fyydEpisodes(p);  // Yedek arşivden gelen podcast
    else {
      const j = await itunes("/lookup?id=" + p.collectionId + "&entity=podcastEpisode&limit=200&country=TR");
      eps = j.results; // İlk sonuç podcastin kendisi; geri kalanlar bölümler
    }
    if (my !== podReq || mode !== "pod") return;
    eps = sortNew(eps);
    renderEps(eps);
    cachePut("cache_eps", key, eps.slice(0,100).map(slimEp)); // Bölüm listesini sakla
    notice("");
  }catch(e){
    if (my !== podReq || mode !== "pod") return;
    // YEDEK: Apple'a ulaşılamazsa aynı podcasti fyyd arşivinde ada göre ara
    try{
      const alt = (await fyydSearch(p.collectionName)).find(x => norm(x.collectionName) === norm(p.collectionName));
      if (alt){
        const eps = sortNew(await fyydEpisodes(alt));
        if (my !== podReq || mode !== "pod") return;
        if (eps.length){ renderEps(eps); notice("⚠️ Apple podcast arşivine ulaşılamadı. Bölümler yedek arşivden (fyyd) geliyor."); return; }
      }
    }catch(_){}
    // YEDEK 2: Daha önce kaydedilen bölüm listesi
    const cached = cacheGet("cache_eps", key);
    if (cached){ renderEps(cached); notice("⚠️ Podcast arşivlerine ulaşılamadı. Son kaydedilen bölüm listesi gösteriliyor."); }
    else $("#list").innerHTML = '<div class="msg">'+e.message+'</div>';
  }
}

/* --- YEDEK PODCAST ARŞİVİ: fyyd.de ---
   Ücretsiz, anahtar istemeyen ikinci bir podcast arşivi.
   Apple'a ulaşılamazsa arama ve bölümler buradan gelir.
   Gelen bilgiler Apple biçimine çevrilir ki uygulamanın geri
   kalanı fark etmeden çalışsın. */
const FYYD = "https://api.fyyd.de/0.2";
async function fyydSearch(term){
  const r = await fetch(FYYD + "/search/podcast?count=50&title=" + encodeURIComponent(term));
  if (!r.ok) throw new Error("fyyd");
  const j = await r.json();
  return (j.data||[]).map(p => ({
    collectionId: "fyyd-" + p.id, fyydId: p.id,
    collectionName: p.title, artistName: p.author,
    artworkUrl100: p.smallImageURL || p.imgURL, releaseDate: p.lastpub,
    trackCount: p.episode_count, primaryGenreName: ""
  }));
}
async function fyydEpisodes(p){
  const r = await fetch(FYYD + "/podcast/episodes?count=150&podcast_id=" + p.fyydId);
  if (!r.ok) throw new Error("fyyd");
  const j = await r.json();
  return ((j.data && j.data.episodes) || []).map(e => ({
    trackId: "fyyd-" + e.id, trackName: e.title, collectionName: p.collectionName,
    episodeUrl: e.enclosure, releaseDate: e.pubdate,
    trackTimeMillis: (e.duration||0) * 1000, artworkUrl160: e.imgURL
  }));
}

// --- Bölüm listesini çiz ---
// Her bölüm: başlık, tarih, süre, dinleme çubuğu, ⬇ indir bağlantısı
function renderEps(eps){
  epsShown = eps;
  const p = curPod, isSub = subs.some(s=>s.collectionId===p.collectionId);
  const head = `<div class="podhead">
      <button id="pback">← Geri</button>
      <img src="${esc(p.artworkUrl100||"")}" onerror="this.style.display='none'">
      <div class="info"><div class="name">${esc(p.collectionName)}</div><div class="meta">${esc(p.artistName||"")}</div></div>
      <button class="fav ${isSub?'yes':''}" id="psub" title="Abone ol">${isSub?'★':'☆'}</button>
    </div>`;
  if (!eps.length){ $("#list").innerHTML = head + '<div class="msg">Bölüm bulunamadı.</div>'; return; }
  $("#list").innerHTML = head + eps.map((e,i)=>epRow(e,i)).join("");
}

// Tek bir bölüm satırı
function epRow(e,i){
  const pr = prog[e.trackId];
  const d = (e.trackTimeMillis||0)/1000 || (pr&&pr.d) || 0;
  const pct = pr && d ? Math.min(100, pr.t/d*100) : 0;
  const date = e.releaseDate ? new Date(e.releaseDate).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}) : "";
  const playing = current && current.trackId === e.trackId;
  return `<div class="st ${playing?'playing':''}" data-e="${i}">
    <div class="info"><div class="name">${esc(e.trackName)}</div>
    <div class="meta">${esc([e.collectionName && !curPod ? e.collectionName : "", date, d ? fmtLong(d) : "", pct>=97 ? "✓ dinlendi" : ""].filter(Boolean).join(" · "))}</div>
    ${pct>0 && pct<97 ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}</div>
    <a class="dl" href="${esc(e.episodeUrl)}" target="_blank" rel="noopener" title="İndir / internetsiz dinlemek için kaydet">⬇️</a>
  </div>`;
}

// --- "Devam et": yarım kalan bölümler (en son dinlenen üstte) ---
function renderContinue(){
  curPod = null;
  const list = Object.values(prog).filter(x=>x.ep && x.t>30 && (!x.d || x.t < x.d-30)).sort((a,b)=>b.at-a.at);
  epsShown = list.map(x=>x.ep).filter(e=>!isBlocked(e));
  $("#list").innerHTML = epsShown.length ? epsShown.map((e,i)=>epRow(e,i)).join("")
    : '<div class="msg">Yarım kalan bölüm yok.</div>';
}

// --- Bölüm çalma ---
function playEp(e){
  playNo++; if (hls){ hls.destroy(); hls = null; } // Radyo denemesini bırak
  current = e;
  audio.src = e.episodeUrl;
  $("#now .name").textContent = e.trackName;
  $("#status").textContent = "Yükleniyor…";
  $("#web").style.display = "none";
  $("#seek").hidden = false;
  // Kaldığı yerden devam: ses dosyası hazır olunca kayıtlı saniyeye git
  const pr = prog[e.trackId];
  audio.onloadedmetadata = ()=>{
    if (pr && pr.t > 5 && (!audio.duration || pr.t < audio.duration - 10)) audio.currentTime = pr.t;
  };
  audio.playbackRate = speeds[speedIdx];
  audio.play().catch(()=>{ $("#status").textContent = "Bu bölüm çalınamadı"; });
  // Telefonun kilit ekranında başlık görünsün
  try{ navigator.mediaSession.metadata = new MediaMetadata({title:e.trackName, artist:e.collectionName||"", artwork:[{src:e.artworkUrl600||e.artworkUrl160||"",sizes:"600x600"}]}); }catch(_){}
  if (curPod) renderEps(epsShown); else if (epsShown.length) $("#list").querySelectorAll(".st").forEach((el,i)=>el.classList.toggle("playing", epsShown[i]===e));
}

// --- Podcast modunda listeye tıklama ---
function podClick(e){
  if (e.target.closest("#pback")){ podSearch(podTerm); return; }               // Geri
  if (e.target.closest("#psub")){ toggleSub(curPod); renderEps(epsShown); return; } // Abone ol/çık
  if (e.target.closest(".dl")) return;                                          // İndir bağlantısı kendi açılır
  const ps = e.target.closest("[data-ps]");
  if (ps){ toggleSub(podsShown[ps.dataset.ps]); renderPods(podsShown, "Henüz abonelik yok."); return; }
  const pp = e.target.closest("[data-p]");
  if (pp){ openPod(podsShown[pp.dataset.p]); return; }
  const ee = e.target.closest("[data-e]");
  if (ee) playEp(epsShown[ee.dataset.e]);
}

// Abone ol / abonelikten çık (sadece bu tarayıcıda saklanır)
function toggleSub(p){
  const i = subs.findIndex(s=>s.collectionId===p.collectionId);
  if (i>=0) subs.splice(i,1);
  else subs.push({collectionId:p.collectionId, collectionName:p.collectionName, artistName:p.artistName, artworkUrl100:p.artworkUrl100, primaryGenreName:p.primaryGenreName, releaseDate:p.releaseDate, trackCount:p.trackCount, feedUrl:p.feedUrl, src:p.src, fyydId:p.fyydId, artworkUrl600:p.artworkUrl600});
  store.set("pod_subs", subs);
}

// --- Sarma çubuğu ve kaldığın yeri kaydetme ---
let dragging = false, lastSave = 0;
audio.ontimeupdate = ()=>{
  if (!current || !current.episodeUrl) return; // Sadece podcastte
  const d = audio.duration || 0;
  if (!dragging){ $("#pos").max = Math.floor(d); $("#pos").value = Math.floor(audio.currentTime); }
  $("#tcur").textContent = fmt(audio.currentTime);
  $("#tdur").textContent = fmt(d);
  // Her beş saniyede bir kaldığın yeri kaydet
  if (Date.now() - lastSave > 5000){
    lastSave = Date.now();
    const e = current;
    prog[e.trackId] = { t: audio.currentTime, d, at: Date.now(),
      ep: {trackId:e.trackId, trackName:e.trackName, collectionName:e.collectionName, episodeUrl:e.episodeUrl, releaseDate:e.releaseDate, trackTimeMillis:e.trackTimeMillis, artworkUrl160:e.artworkUrl160} };
    store.set("pod_prog", prog);
  }
};
$("#pos").oninput  = ()=>{ dragging = true; $("#tcur").textContent = fmt($("#pos").value); };
$("#pos").onchange = ()=>{ audio.currentTime = $("#pos").value; dragging = false; };
$("#back15").onclick = ()=>{ audio.currentTime = Math.max(0, audio.currentTime - 15); };
$("#fwd30").onclick  = ()=>{ audio.currentTime = Math.min(audio.duration||1e9, audio.currentTime + 30); };
// Hız: 1x → 1.25x → 1.5x → 2x → 0.75x → 1x …
const speeds = [1, 1.25, 1.5, 2, 0.75];
let speedIdx = 0;
$("#speed").onclick = ()=>{
  speedIdx = (speedIdx+1) % speeds.length;
  audio.playbackRate = speeds[speedIdx];
  $("#speed").textContent = speeds[speedIdx] + "x";
};
// Bölüm bitince "dinlendi" olarak işaretle
audio.onended = ()=>{
  if (current && current.episodeUrl && prog[current.trackId]){ prog[current.trackId].t = prog[current.trackId].d = audio.duration||1; store.set("pod_prog", prog); }
};

  const c = store.get(bucket, {});

  const keys = Object.keys(c).sort((a,b)=>c[b].at-c[a].at);
  keys.slice(30).forEach(k => delete c[k]);

}

  return c[key] ? c[key].val : null;

// RSS akışını oku. Sıra: doğrudan → çevirici 1 (rss2json) → çevirici 2 (allorigins)
async function fetchFeed(url){
  // 1) Doğrudan
  try{
    const r = await fetch(url);
    if (r.ok) return parseRss(await r.text());
  }catch(_){}
  // 2) rss2json (ücretsiz RSS → JSON çevirici)
  try{
    const j = await (await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url))).json();
    if (j.status === "ok") return j.items.map(i => ({ title:i.title, link:i.link, date:i.pubDate, desc:i.description||i.content||"", author:i.author||"" }));
  }catch(_){}
  // 3) allorigins (ücretsiz aracı sunucu)
  const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
  if (!r.ok) throw new Error("ulaşılamadı");
  return parseRss(await r.text());
}

// RSS (XML) metnini yazı listesine çevirir
function parseRss(text){
  const x = new DOMParser().parseFromString(text, "text/xml");
  return [...x.querySelectorAll("item")].map(i => {
    const get = t => { const n = i.getElementsByTagName(t)[0]; return n ? n.textContent : ""; };
    return { title:get("title"), link:get("link"), date:get("pubDate"), desc:get("description"),
             author:get("dc:creator") || get("author") };
  });
}

// "ad-soyad" → "Ad Soyad"
function slugName(s){
  return s.split("-").filter(Boolean).map(w => w.charAt(0).toLocaleUpperCase("tr") + w.slice(1)).join(" ");
}

// Yazar adını, başlığı ve özeti gazeteye göre düzenler
function tidy(it, src){
  let author = (it.author||"").trim(), title = (it.title||"").trim();
  const desc = (it.desc||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
  let path = [];
  try{ path = new URL(it.link).pathname.split("/").filter(Boolean); }catch(_){}
  if (src.author === "title" && title.includes(" / ")){
    const k = title.indexOf(" / ");
    author = title.slice(0,k); title = title.slice(k+3);
    author = author.toLocaleLowerCase("tr").replace(/(^|\s)\S/g, c => c.toLocaleUpperCase("tr"));
  } else if (src.author === "titleIsAuthor"){
    author = title;
    // Başlık bağlantıdan çıkarılır: /ozur-dileyerek-p380438 → "Özür dileyerek" (Türkçe harfler olmadan)
    const slug = (path[path.length-1]||"").replace(/-p\d+$/,"");
    title = slug ? slugName(slug).replace(/ (\S)/g, (m,c)=>" "+c.toLocaleLowerCase("tr")) : "";
  } else if (src.author === "url" && !author){
    const i = path.indexOf("yazarlar");
    const seg = i >= 0 ? path[i+1] : (path.length >= 3 ? path[1] : "");
    if (seg && !/^\d/.test(seg)) author = slugName(seg);
  }
  return { author, title: title || desc.slice(0,80), link:it.link, date:it.date,
           t: Date.parse(it.date) || 0, ex: desc.slice(0,300), src: src.name };
}

// Bir gazetenin yazılarını getir (olmazsa önbellek)
async function loadSource(src){
  try{
    const items = (await fetchFeed(src.url)).map(it => tidy(it, src));
    if (!items.length) throw new Error("boş");
    cachePut("cache_cols", src.id, items.slice(0,60));
    return { items, cached:false };
  }catch(e){
    const c = cacheGet("cache_cols", src.id);
    if (c) return { items:c, cached:true };
    throw e;
  }
}

// Seçilen gazeteyi (veya Tümü'nü) göster
async function colShow(sel){
  colSel = sel; colTabs();
  const my = ++colReq;
  if (sel === "__add__"){ colAddView(); return; }
  $("#list").innerHTML = '<div class="msg">Yazılar yükleniyor…</div>';
  const sources = sel === "__all__" ? allColSources() : allColSources().filter(s => s.id === sel);
  let items = [], failed = [], cached = [];
  // Gazeteler sırayla değil hep birlikte istenir; her biri gelince liste güncellenir
  await Promise.all(sources.map(async src => {
    try{
      const r = await loadSource(src);
      if (r.cached) cached.push(src.name);
      items = items.concat(r.items);
      if (my === colReq && mode === "col") colRender(items);
    }catch(_){ failed.push(src.name); }
  }));
  if (my !== colReq || mode !== "col") return;
  colRender(items);
  let msg = "";
  if (cached.length) msg += "⚠️ Son kaydedilen yazılar gösteriliyor: " + cached.join(", ") + ". ";
  if (failed.length) msg += "⚠️ Ulaşılamadı: " + failed.join(", ") + ".";
  notice(msg);
  if (!items.length) $("#list").innerHTML = '<div class="msg">Yazı bulunamadı.</div>';
}

// Yazı listesini çiz: en yeni üstte, arama ve engelleme filtresi uygulanır
function colRender(items){
  const k = norm($("#cq").value.trim());
  colItems = items
    .filter(x => !isBlocked({collectionName:x.title, artistName:x.author}))
    .filter(x => !k || norm(x.author + " " + x.title + " " + x.src).includes(k))
    .sort((a,b) => b.t - a.t);
  if (!colItems.length){ $("#list").innerHTML = '<div class="msg">'+(k?"Sonuç bulunamadı.":"Yükleniyor…")+'</div>'; return; }
  $("#list").innerHTML = colItems.map((x,i) => `<div class="st col" data-c="${i}">
      <div class="info">
        <div class="who">${esc(x.author || x.src)}</div>
        <div class="name">${esc(x.title)}</div>
        <div class="meta">${esc([x.src, x.t ? new Date(x.t).toLocaleString("tr-TR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}) : ""].filter(Boolean).join(" · "))}</div>
        ${x.ex ? `<div class="ex">${esc(x.ex)}</div>` : ""}
      </div>
      <button class="fav" data-say="${i}" title="Özeti sesli dinle">🔊</button>
    </div>`).join("");
}

// Yazar/başlık araması (yazdıkça)
let ctyping;
$("#cq").oninput = ()=>{
  clearTimeout(ctyping);
  ctyping = setTimeout(()=>{
    if (colSel === "__add__") colShow("__all__");
    else colRender(colItemsAll());
  }, 250);
};
// Filtrelenmemiş tam liste (arama için) önbellekten toplanır
function colItemsAll(){
  const ids = colSel === "__all__" ? allColSources().map(s=>s.id) : [colSel];
  return ids.flatMap(id => cacheGet("cache_cols", id) || []);
}

// Köşe yazısına tıklama: 🔊 özeti sesli okur, satıra dokunmak yazıyı gazetede açar
function colClick(e){
  const del = e.target.closest("[data-cdel]");
  if (del){ colCustom.splice(+del.dataset.cdel,1); store.set("col_custom", colCustom); colShow("__add__"); return; }
  if (e.target.closest("#colform")) return;
  const say = e.target.closest("[data-say]");
  if (say){
    const x = colItems[say.dataset.say];
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance((x.author ? x.author + ". " : "") + x.title + ". " + x.ex);
      u.lang = "tr-TR";
      speechSynthesis.speak(u);
    }catch(_){}
    return;
  }
  const row = e.target.closest("[data-c]");
  if (row){
    const x = colItems[row.dataset.c];
    if (x && x.link) window.open(x.link, "_blank", "noopener");
  }
}

// "➕ Gazete ekle": listede olmayan bir gazetenin RSS adresini ekleme
function colAddView(){
  $("#list").innerHTML = `
    <form class="addform" id="colform">
      <b>➕ Gazete veya yazar ekle</b>
      <input id="cf_name" placeholder="Ad (ör. Yeni Gazete)" required>
      <input id="cf_url" placeholder="RSS adresi (https://…/rss/yazarlar)" required>
      <button type="submit">Ekle</button>
      <small>Çoğu gazetenin sitesinin altında "RSS" bağlantısı vardır. Bir yazarın kendi RSS'i de eklenebilir.</small>
    </form>
    ${colCustom.map((s,i)=>`<div class="st"><div class="info"><div class="name">${esc(s.name)}</div><div class="meta">${esc(s.url)}</div></div>
      <button class="fav" data-cdel="${i}" title="Sil">🗑</button></div>`).join("")}`;
}
$("#list").addEventListener("submit", e=>{
  if (e.target.id !== "colform") return;
  e.preventDefault();
  const name = $("#cf_name").value.trim(), url = $("#cf_url").value.trim();
  if (!/^https?:\/\//i.test(url)) return;
  const id = "ozel-" + Date.now();
  colCustom.push({ id, name, url, author:"url" });
  store.set("col_custom", colCustom);
  colShow(id);
});

/* ============================================================
   9) KAPANMA ZAMANLAYICISI
   ------------------------------------------------------------
   Seçilen süre dolunca radyo veya podcast kendiliğinden durur.
   Son on saniyede ses yavaş yavaş kısılır, sonra durur.
   Kalan süre 🌙 düğmesinin üstünde görünür.
   ============================================================ */
let sleepEnd = 0, sleepTimer = null;

// Paneli aç / kapat
$("#sleepBtn").onclick = ()=>{ $("#sleepPanel").hidden = !$("#sleepPanel").hidden; };

// Hazır süreler (15, 30, 45, 60 dakika)
document.querySelectorAll("#sleepPanel [data-min]").forEach(b => b.onclick = ()=> setSleep(+b.dataset.min));
// Elle yazılan süre
$("#sleepSet").onclick = ()=>{
  const m = parseInt($("#sleepMin").value, 10);
  if (m > 0) setSleep(m);
};
$("#sleepMin").onkeydown = e=>{ if (e.key === "Enter") $("#sleepSet").click(); };
// İptal
$("#sleepOff").onclick = ()=> setSleep(0);

// Zamanlayıcıyı kur (0 = iptal)
function setSleep(min){
  clearInterval(sleepTimer);
  $("#sleepPanel").hidden = true;
  if (!min){
    sleepEnd = 0;
    $("#sleepBtn").textContent = "🌙";
    $("#sleepBtn").classList.remove("on");
    return;
  }
  sleepEnd = Date.now() + min * 60000;
  $("#sleepBtn").classList.add("on");
  sleepTick();
  sleepTimer = setInterval(sleepTick, 1000); // Her saniye kalan süreyi güncelle
}

// Her saniye çalışır: süre dolduysa durdur, değilse kalan süreyi yaz
function sleepTick(){
  const left = sleepEnd - Date.now();
  if (left <= 0){ clearInterval(sleepTimer); sleepFadeStop(); return; }
  $("#sleepBtn").textContent = "🌙 " + fmt(left / 1000);
}

// Sesi on saniyede yavaşça kıs, durdur, ses seviyesini eski haline getir
function sleepFadeStop(){
  const v = audio.volume;
  let step = 0;
  const fade = setInterval(()=>{
    step++;
    audio.volume = Math.max(0, v * (1 - step / 20));
    if (step >= 20){
      clearInterval(fade);
      audio.pause();
      audio.volume = v;
      setSleep(0);
      setTimeout(()=>{ $("#status").textContent = "Zamanlayıcı ile durduruldu"; }, 100);
    }
  }, 500);
}

load();
</script>

<script>
(function(){
  const np = $("#np");
  const isPod = ()=> !!(current && current.episodeUrl);
  const tfmt = s => (typeof fmt === "function") ? fmt(s) : Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

  /* ---------- KALDIĞIN YERİ KAYDETME ---------- */
  if (typeof prog !== "undefined"){
    // Şu anki bölümün yerini hemen kaydeder
    window.saveProg = function(){
      const e = current;
      if (!e || !e.episodeUrl || !audio.currentTime) return;
      const d = audio.duration || (prog[e.trackId] && prog[e.trackId].d) || 0;
      prog[e.trackId] = { t: audio.currentTime, d, at: Date.now(),
        ep: {trackId:e.trackId, trackName:e.trackName, collectionName:e.collectionName, episodeUrl:e.episodeUrl,
             releaseDate:e.releaseDate, trackTimeMillis:e.trackTimeMillis, artworkUrl160:e.artworkUrl160||e.artworkUrl600||""} };
      store.set("pod_prog", prog);
      store.set("pod_last", e.trackId);
    };
    // Duraklatınca, sarınca, uygulamadan çıkınca kaydet
    audio.addEventListener("pause",  ()=>saveProg());
    audio.addEventListener("seeked", ()=>saveProg());
    document.addEventListener("visibilitychange", ()=>{ if (document.hidden) saveProg(); });
    window.addEventListener("pagehide", ()=>saveProg());

    // Bölüm çalarken: önceki bölümün yerini kaydet, kayıtlı yere güvenle git
    const eskiPlayEp = playEp;
    playEp = function(e){
      saveProg();
      eskiPlayEp(e);
      const pr = prog[e.trackId];
      if (pr && pr.t > 5 && (!pr.d || pr.t < pr.d - 10)){
        $("#status").textContent = "Kaldığınız yerden: " + tfmt(pr.t);
        // Bazı sunucularda ilk deneme tutmaz; çalmaya hazır olunca tekrar dene
        const tekrar = ()=>{ audio.removeEventListener("canplay", tekrar);
          if (current === e && audio.currentTime < pr.t - 3) audio.currentTime = pr.t; };
        audio.addEventListener("canplay", tekrar);
      }
      store.set("pod_last", e.trackId);
      $("#resumeCard").hidden = true;
      npUpdate();
    };

    // Hız tercihini hatırla
    if (typeof speeds !== "undefined"){
      const sp = store.get("pod_speed", 0);
      if (speeds[sp]){ speedIdx = sp; $("#speed").textContent = speeds[sp] + "x"; }
      $("#speed").addEventListener("click", ()=>{ store.set("pod_speed", speedIdx); npUpdate(); });
    }

    // Açılışta son yarım kalan bölümü öner
    const last = prog[store.get("pod_last", "")];
    if (last && last.ep && last.t > 30 && (!last.d || last.t < last.d - 30)){
      $("#resumeName").textContent = last.ep.trackName;
      $("#resumeTime").textContent = (last.ep.collectionName ? last.ep.collectionName + " · " : "") + tfmt(last.t) + (last.d ? " / " + tfmt(last.d) : "");
      $("#resumeCard").hidden = false;
      $("#resumeGo").onclick = ()=>{ playEp(last.ep); };
      $("#resumeX").onclick  = ()=>{ $("#resumeCard").hidden = true; };
    }
  }

  /* ---------- GELİŞMİŞ OYNATMA EKRANI ---------- */
  // Çubuğa "büyüt" düğmesi
  const ob = document.createElement("button");
  ob.id = "npOpen"; ob.title = "Büyük oynatıcıyı aç"; ob.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>';
  $("#now").after(ob);
  const ac = ()=>{ if (!current) return; np.hidden = false; document.body.classList.add("npOn"); npUpdate(); };
  ob.onclick = ac;
  $("#now").addEventListener("click", ac);
  $("#npClose").onclick = ()=>{ np.hidden = true; document.body.classList.remove("npOn"); };

  // Dinleme süresi sayacı
  let since = 0, item = null;
  audio.addEventListener("playing", ()=>{ if (item !== current){ item = current; since = Date.now(); } });

  // Ekrandaki bilgileri günceller
  function npUpdate(){
    if (!current) return;
    const pod = isPod();
    $("#npName").textContent = pod ? current.trackName : (current.name||"").trim();
    $("#npKind").textContent = pod ? "PODCAST" : "CANLI RADYO";
    const img = pod ? (current.artworkUrl600 || current.artworkUrl160 || (typeof curPod!=="undefined" && curPod && curPod.artworkUrl600) || "") : (current.favicon || "");
    const harf = ((pod ? current.collectionName : current.name) || "♫").trim()[0] || "♫";
    $("#npArt").innerHTML = img ? `<img src="${esc(img)}" alt="" onerror="this.outerHTML='${esc(harf)}'">` : esc(harf);
    $("#npBg").style.backgroundImage = img ? `url("${img.replace(/"/g,"")}")` : "none";
    if (pod){
      $("#npSub").textContent = current.collectionName || "";
      const d = current.releaseDate ? new Date(current.releaseDate).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}) : "";
      $("#npChips").innerHTML = d ? `<span>${esc(d)}</span>` : "";
    } else {
      $("#npSub").textContent = [current.state, current.country].filter(Boolean).join(", ");
      const tags = (current.tags||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,3);
      $("#npChips").innerHTML = [...tags, current.codec, current.bitrate ? current.bitrate + " kbps" : ""].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("");
    }
    // Podcastte sarma, hız; radyoda favori ve yayın akışı
    $("#npSeek").hidden = !pod; $("#npB15").hidden = !pod; $("#npF30").hidden = !pod;
    $("#npSpeed").hidden = !pod || typeof speeds === "undefined";
    if (!$("#npSpeed").hidden) $("#npSpeed").textContent = "⏱ " + speeds[speedIdx] + "x";
    $("#npFav").hidden = pod || current.custom;
    const fav = !pod && favs.some(f=>f.stationuuid===current.stationuuid);
    $("#npFav").textContent = fav ? "★ Favoride" : "☆ Favori";
    $("#npFav").classList.toggle("yes", fav);
    const w = $("#npWeb");
    w.hidden = pod || !current.homepage; if (!w.hidden) w.href = current.homepage;
    $("#npVol").value = audio.volume;
    np.classList.toggle("playing", !audio.paused);
    $("#npPP").textContent = audio.paused ? "▶" : "⏸";
    // Kilit ekranı / bildirim bilgisi
    try{ if (!pod) navigator.mediaSession.metadata = new MediaMetadata({title:current.name, artist:"Kızılelma Radyo", artwork: img ? [{src:img, sizes:"512x512"}] : []}); }catch(_){}
  }
  window.npUpdate = npUpdate;

  // Alttaki durum yazısını büyük ekrana da yansıt
  new MutationObserver(()=>{ $("#npStatus").textContent = $("#status").textContent; }).observe($("#status"), {childList:true, characterData:true, subtree:true});
  ["playing","pause","waiting","emptied","loadstart"].forEach(ev=>audio.addEventListener(ev, npUpdate));

  // Süre ve sarma çubuğu
  let drag = false;
  setInterval(()=>{
    if (np.hidden || !current) return;
    if (isPod()){
      const d = audio.duration || 0;
      if (!drag){ $("#npPos").max = Math.floor(d); $("#npPos").value = Math.floor(audio.currentTime); }
      $("#npCur").textContent = tfmt(audio.currentTime); $("#npDur").textContent = tfmt(d);
    } else if (!audio.paused && since){
      const c = $("#npChips"); let s = c.querySelector(".sure");
      if (!s){ s = document.createElement("span"); s.className = "sure"; c.appendChild(s); }
      s.textContent = "⏱ " + tfmt((Date.now()-since)/1000);
    }
  }, 1000);
  $("#npPos").oninput  = ()=>{ drag = true; $("#npCur").textContent = tfmt($("#npPos").value); };
  $("#npPos").onchange = ()=>{ audio.currentTime = $("#npPos").value; drag = false; };

  // Düğmeler
  $("#npPP").onclick  = ()=> $("#pp").click();
  $("#npB15").onclick = ()=> $("#back15").click();
  $("#npF30").onclick = ()=> $("#fwd30").click();
  $("#npSpeed").onclick = ()=> $("#speed").click();
  $("#npVol").oninput = e=>{ audio.volume = e.target.value; $("#vol").value = e.target.value; store.set("radyo_vol", e.target.value); };
  $("#npSleep").onclick = ()=> $("#sleepBtn").click();
  $("#npFav").onclick = ()=>{
    if (!current || isPod()) return;
    const i = favs.findIndex(x=>x.stationuuid===current.stationuuid);
    i>=0 ? favs.splice(i,1) : favs.push(current);
    store.set("radyo_favs", favs);
    if (typeof mode === "undefined" || mode === "radio") render(showFav ? favs : window._shown);
    npUpdate();
  };
  // Önceki / sonraki: ekrandaki listede bir öncekine/sonrakine geç
  function step(n){
    if (!current) return;
    if (isPod()){
      const l = (typeof epsShown !== "undefined" ? epsShown : []);
      const i = l.findIndex(x=>x.trackId===current.trackId);
      if (i>=0 && l[i+n]) playEp(l[i+n]);
    } else {
      const l = (window._shown||[]).filter(x=>x && (x.url_resolved||x.url));
      const i = l.findIndex(x=>x.stationuuid===current.stationuuid);
      const j = i<0 ? 0 : (i+n+l.length) % l.length;
      if (l[j]) play(l[j]);
    }
    setTimeout(npUpdate, 50);
  }
  $("#npPrev").onclick = ()=>step(-1);
  $("#npNext").onclick = ()=>step(1);
  try{
    navigator.mediaSession.setActionHandler("previoustrack", ()=>step(-1));
    navigator.mediaSession.setActionHandler("nexttrack", ()=>step(1));
  }catch(_){}
  // Paylaş: telefonun paylaş menüsü, yoksa panoya kopyala
  $("#npShare").onclick = async ()=>{
    if (!current) return;
    const ad = isPod() ? current.trackName : current.name;
    const url = isPod() ? current.episodeUrl : (current.homepage || current.url_resolved || current.url);
    const text = ad + " · Kızılelma Radyo ile dinliyorum";
    try{ if (navigator.share){ await navigator.share({title:ad, text, url}); return; } }catch(_){ return; }
    try{ await navigator.clipboard.writeText(text + " " + url); $("#npStatus").textContent = "Bağlantı kopyalandı"; }catch(_){}
  };

  // Android geri tuşu: önce büyük oynatıcıyı kapat
  if (window.androidBack){
    const eskiGeri = window.androidBack;
    window.androidBack = ()=>{
      if (!$("#sleepPanel").hidden){ $("#sleepPanel").hidden = true; return true; }
      if (!np.hidden){ $("#npClose").click(); return true; }
      return eskiGeri();
    };
  }
})();
</script>


<!-- ============================================================

     ============================================================ -->
