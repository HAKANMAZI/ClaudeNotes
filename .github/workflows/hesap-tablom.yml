# Hesap Tablom Windows uygulamasını test eder, HesapTablom.exe olarak derler ve Releases bölümüne koyar.
name: Hesap Tablom Windows EXE
on:
  push:
    branches: [main]
    paths:
      - "hesap-tablom/**"
      - ".github/workflows/hesap-tablom.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hesap-tablom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Testler
        run: python -m pytest -q tests
      - name: EXE derle
        run: python -m PyInstaller --noconfirm --onefile --windowed --name HesapTablom --icon assets\icon.ico --add-data "assets;assets" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: HesapTablom-exe
          path: hesap-tablom/dist/HesapTablom.exe
      # Sabit indirme linki: .../releases/download/hesap-tablom/HesapTablom.exe
      - name: Sabit linke koy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hesap-tablom --yes --cleanup-tag || true
          gh release create hesap-tablom dist/HesapTablom.exe --title "Hesap Tablom (son sürüm)" --notes "HesapTablom.exe: Windows için hesap tablosu. İndirip çift tıklayın, kurulum gerekmez."
