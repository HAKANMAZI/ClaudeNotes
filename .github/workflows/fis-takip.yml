# Fiş Takip Android APK'larını (Türkçe ve İngilizce) derler ve Releases bölümüne koyar.
name: Fiş Takip Android APK
on:
  push:
    branches: [main]
    paths:
      - "fis_takip/android/**"
      - "fis_takip/web/**"
      - ".github/workflows/fis-takip.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fis_takip/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Türkçe ve İngilizce APK derle
        run: |
          set -e
          build () {
            # $1 dil, $2 uygulama kimliği, $3 uygulama adı, $4 web dosyası
            rm -rf android www && mkdir -p www && cp "$4" www/index.html
            printf '{"appId":"%s","appName":"%s","webDir":"www"}\n' "$2" "$3" > capacitor.config.json
            npx cap add android
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
            npx cap sync android
            (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk "fis-takip-$1.apk"
          }
          build tr com.hakanmazi.fistakip "Fiş Takip" ../web/index.html
          build en com.hakanmazi.receipttracker "Receipt Tracker" ../web/en/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: FisTakip-apk
          path: fis_takip/android/fis-takip-*.apk
      # Sabit indirme linki: .../releases/download/fis-takip/fis-takip-tr.apk (ve -en.apk)
      - name: Sabit linke koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fis-takip --yes --cleanup-tag || true
          gh release create fis-takip fis-takip-tr.apk fis-takip-en.apk --title "Fiş Takip / Receipt Tracker (son sürüm)" --notes "fis-takip-tr.apk: Türkçe. fis-takip-en.apk: English. Telefondan indirip kurun."
