# Fiş Takip v3: Türkçe Android APK'sını derler ve Releases'a koyar.
# v1 dondurulmuştur; APK'ları Releases → fis-takip etiketinde durur.
name: Fiş Takip Android APK
on:
  push:
    branches: [main]
    paths:
      - "fis_takip/v3/android/**"
      - ".github/workflows/fis-takip.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fis_takip/v3/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Türkçe APK derle
        run: |
          set -e
          rm -rf android www && mkdir -p www && cp index.html www/index.html
          printf '{"appId":"com.hakanmazi.fistakip","appName":"Fiş Takip","webDir":"www"}\n' > capacitor.config.json
          npx cap add android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.CAMERA" />#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk fis-takip-tr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FisTakip-v3-apk
          path: fis_takip/v3/android/fis-takip-tr.apk
      # Sabit indirme linki: .../releases/download/fis-takip-v3/fis-takip-tr.apk
      - name: Sabit linke koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fis-takip-v3 --yes --cleanup-tag || true
          gh release create fis-takip-v3 fis-takip-tr.apk --title "Fiş Takip v3 (Türkçe, son sürüm)" --notes "Telefondan indirip kurun. Eski sürümün üzerine güncellenir."
