name: Ekran Temizle APK
on:
  workflow_dispatch:
  push:
    paths: ['ekran-temizle/**', '.github/workflows/ekran-temizle.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ekran-temizle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk EkranTemizle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EkranTemizle-apk
          path: ekran-temizle/EkranTemizle.apk
      # Sabit indirme linki: .../releases/download/ekran-temizle/EkranTemizle.apk
      - name: Sabit linke koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ekran-temizle --yes --cleanup-tag || true
          gh release create ekran-temizle EkranTemizle.apk --title "Ekran Temizle (son sürüm)" --notes "Telefondan indirip kurun."
