:root[data-theme="dark"]{--bg:#05060E}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;max-width:620px;margin:0 auto}
canvas{display:block;width:100%;height:100%}

.card h1{margin:0;font-size:2.4rem;line-height:1.05;color:var(--ring);text-shadow:0 0 18px currentColor}
.card h2{margin:.2rem 0 0;font-size:1rem;font-weight:500;opacity:.8}
.card p{margin:.7rem 0 .5rem;font-family:"Lora",Georgia,serif;font-style:italic;line-height:1.55;font-size:1rem}
#goal{margin:.4rem 0 .6rem;padding:.6rem .8rem;border-radius:14px;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35);color:#FFD166;font-weight:800;font-size:1.1rem}
#goal .dots{display:flex;gap:5px;justify-content:center;margin-top:5px}
#goal .dot{width:13px;height:13px;border-color:rgba(255,209,102,.6)}
.card .new{margin:0 0 1rem;font-size:.92rem;line-height:1.4;color:#9AE6FF}
#list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:.6rem 0 1rem;max-height:46vh;overflow:auto}
.chip{padding:2px 9px;border-radius:999px;font-size:.85rem;font-weight:500;background:rgba(255,255,255,.06);border:1px solid currentColor}
.card.win{border-color:rgba(91,227,125,.5)} .card.win h1,.card.win h2,.card.win p{color:var(--win)}
.card.lose{border-color:rgba(255,77,94,.5)} .card.lose h1,.card.lose h2,.card.lose p{color:var(--lose)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card button{font:800 1.05rem "Baloo 2",sans-serif;border:0;border-radius:999px;padding:.5rem 1.4rem;background:var(--ring);color:#05060E}
.card.win button#go{background:var(--win)} .card.lose button#go{background:var(--lose);color:#fff}
.card button.alt{background:transparent;color:var(--ink);border:1px solid rgba(233,241,255,.3)}
button:focus-visible{outline:3px solid #FFD166;outline-offset:3px}
.hidden{display:none!important}
</style>
</head>
