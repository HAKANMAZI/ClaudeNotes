plugins { id 'com.android.application' }
android {
    namespace 'com.hasan.yanki'
    compileSdk 34
    defaultConfig { minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }
    flavorDimensions 'lang'
    productFlavors {
        tr { dimension 'lang'; applicationId 'com.hasan.yanki' }
        en { dimension 'lang'; applicationId 'com.hasan.echo' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
