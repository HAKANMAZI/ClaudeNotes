<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Kazanç</title>
<style>
  :root { --a:#0b8043; --z:#f4f6f8; --k:#1f2933; --g:#6b7785; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--z); color:var(--k); }
  header { background:var(--a); color:#fff; padding:12px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  header .logo { font-size:20px; margin-right:auto; }
  main { max-width:980px; margin:0 auto; padding:16px; }
  form.ara { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  input, select, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid #cfd6dd; }
  input[type=text] { flex:1; min-width:200px; }
  button { background:var(--a); color:#fff; border:none; cursor:pointer; font-weight:600; }
  button.ikinci { background:#fff; color:var(--a); border:1px solid var(--a); }
  .kart { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .satir { display:flex; gap:12px; align-items:center; }
  .satir img { width:56px; height:56px; border-radius:12px; }
  .kucuk { color:var(--g); font-size:13px; }
  .para { color:var(--a); font-weight:700; font-size:18px; white-space:nowrap; }
  .izgara { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
  .kutu { background:var(--z); border-radius:10px; padding:10px; }
  .kutu b { display:block; font-size:18px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #e5e9ed; }
  .uyari { background:#fff8e1; border-left:4px solid #f4b400; padding:10px; border-radius:6px; font-size:13px; }
  .bildirim { background:#e6f4ea; padding:10px; border-radius:8px; margin-bottom:12px; }
  a { color:var(--a); }
  .artis { color:#0b8043; } .dusus { color:#c5221f; }
</style>
</head>
<body>
<header>
  <a class="logo" href="{{ url_for('anasayfa') }}">📈 Play Kazanç</a>
  <a href="{{ url_for('anasayfa') }}">Ara</a>
  <a href="{{ url_for('trendler') }}">Trendler</a>
</header>
<main>
  {% for m in get_flashed_messages() %}<div class="bildirim">{{ m }}</div>{% endfor %}
  {% block icerik %}{% endblock %}
  <p class="uyari">Tahminler; indirme sayısı, kategori, reklam ve uygulama içi satın alma bilgisinden türetilen yaklaşık aralıklardır. Gerçek gelir farklı olabilir.</p>
</main>
</body>
</html>
